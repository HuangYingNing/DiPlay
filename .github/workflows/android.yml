name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build and publish a signed GitHub Release
        required: true
        type: boolean
        default: false
      release_version:
        description: Release version, for example v0.2.16-b261108-001
        required: false
        type: string
      release_notes_path:
        description: Repository-relative Markdown release notes path
        required: false
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: diplay-debug-apk
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
  release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish_release
    needs: check
    permissions:
      contents: write
    concurrency:
      group: android-release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release metadata
        id: release_metadata
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
          REQUESTED_NOTES_PATH: ${{ inputs.release_notes_path }}
        run: |
          set -euo pipefail
          configured_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' mobile/build.gradle.kts | head -n 1)"
          if [[ -z "$configured_version" ]]; then
            echo "::error::Could not read the base version from mobile/build.gradle.kts"
            exit 1
          fi
          base_version="${configured_version#v}"
          version="${REQUESTED_VERSION:-$base_version}"
          escaped_base_version="${base_version//./\\.}"
          if [[ ! "$version" =~ ^v${escaped_base_version}-b[0-9]{6}-[0-9]{3}$ ]]; then
            echo "::error::Release version must match v${base_version}-bYYMMDD-NNN"
            exit 1
          fi
          notes_path="${REQUESTED_NOTES_PATH:-docs/UPDATE-NOTES-${base_version}.md}"
          if [[ "$notes_path" = /* || "$notes_path" == *..* || ! -s "$notes_path" ]]; then
            echo "::error::Release notes must be a non-empty repository-relative file"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"
      - name: Check release signing and CarPlay authentication
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MFI_IDENTITY_BASE64: ${{ secrets.DIPLAY_AUTH_IDENTITY_BASE64 }}
          MFI_CERTIFICATE_BASE64: ${{ secrets.DIPLAY_AUTH_CERTIFICATE_BASE64 }}
          PASTEDB_KEY_ENDPOINT: ${{ secrets.PASTEDB_KEY_ENDPOINT }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || -z "$MFI_IDENTITY_BASE64" || -z "$MFI_CERTIFICATE_BASE64" || "$PASTEDB_KEY_ENDPOINT" != https://* ]]; then
            echo "::error::Release is not configured. Add the signing secrets, both DIPLAY_AUTH_* secrets, and the HTTPS PASTEDB_KEY_ENDPOINT secret."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.available == 'true'
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.available == 'true'
      - name: Prepare release signing key
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/diplay-release.jks"
      - name: Prepare CarPlay authentication assets
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          MFI_IDENTITY_BASE64: ${{ secrets.DIPLAY_AUTH_IDENTITY_BASE64 }}
          MFI_CERTIFICATE_BASE64: ${{ secrets.DIPLAY_AUTH_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          auth_dir="$RUNNER_TEMP/diplay-auth-assets/offline-mfi"
          mkdir -p "$auth_dir"
          printf '%s' "$MFI_IDENTITY_BASE64" | base64 --decode > "$auth_dir/identity.pk8"
          printf '%s' "$MFI_CERTIFICATE_BASE64" | base64 --decode > "$auth_dir/certificate.p7b"
          test -s "$auth_dir/identity.pk8"
          test -s "$auth_dir/certificate.p7b"
          openssl pkey -inform DER -in "$auth_dir/identity.pk8" -noout -check >/dev/null
          openssl pkcs7 -inform DER -in "$auth_dir/certificate.p7b" -print_certs -noout >/dev/null
          key_fingerprint="$(openssl pkey -inform DER -in "$auth_dir/identity.pk8" -pubout -outform DER | sha256sum | cut -d' ' -f1)"
          cert_fingerprint="$(openssl pkcs7 -inform DER -in "$auth_dir/certificate.p7b" -print_certs -outform PEM | openssl x509 -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
          if [[ "$key_fingerprint" != "$cert_fingerprint" ]]; then
            echo "::error::CarPlay identity and certificate do not match."
            exit 1
          fi
      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/diplay-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/diplay-auth-assets
          PASTEDB_KEY_ENDPOINT: ${{ secrets.PASTEDB_KEY_ENDPOINT }}
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: ./gradlew :mobile:assembleRelease -PDIPLAY_RELEASE_VERSION="$RELEASE_VERSION" --stacktrace
      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: diplay-release-apk
          path: mobile/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: steps.signing.outputs.available == 'true'
        uses: actions/github-script@v7
        env:
          APP_VERSION: ${{ steps.release_metadata.outputs.version }}
          RELEASE_NOTES_PATH: ${{ steps.release_metadata.outputs.notes_path }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const version = process.env.APP_VERSION;
            const tag = version;
            const assetName = `DiPlay-${version}.apk`;
            const releaseNotes = fs.readFileSync(process.env.RELEASE_NOTES_PATH, 'utf8').trim();
            if (!releaseNotes) throw new Error(`Release notes for ${version} are empty`);
            const apkDir = 'mobile/build/outputs/apk/release';
            const apks = fs.readdirSync(apkDir).filter(name => name.endsWith('.apk'));
            if (apks.length !== 1) throw new Error(`Expected one release APK, found ${apks.length}`);
            const apkPath = `${apkDir}/${apks[0]}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              throw new Error(`Release already exists: ${tag}`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data: release } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `DiPlay ${tag}`,
                body: releaseNotes,
                draft: false,
                prerelease: false,
                make_latest: 'true',
            });
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: assetName,
              data: fs.readFileSync(apkPath),
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': fs.statSync(apkPath).size,
              },
            });
            // carlito | The fork's in-app updater verifies this published APK before installation.
            const checksums = Buffer.from(`${crypto.createHash('sha256').update(fs.readFileSync(apkPath)).digest('hex')}  ${assetName}\n`, 'utf8');
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: 'SHA256SUMS.txt',
              data: checksums,
              headers: { 'content-type': 'text/plain', 'content-length': checksums.length },
            });
            core.notice(`Published ${assetName} to ${tag}`);
      - name: Remove temporary signing key
        if: always() && steps.signing.outputs.available == 'true'
        run: rm -f "$RUNNER_TEMP/diplay-release.jks" && rm -rf "$RUNNER_TEMP/diplay-auth-assets"
