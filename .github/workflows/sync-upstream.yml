name: Sync upstream

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure sync commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/shihabal3amri/DiPlay.git
          git fetch upstream main
      - name: Merge upstream changes
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="$(git rev-parse upstream/main)"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream commits."
            exit 0
          fi
          if git merge-base --is-ancestor HEAD "$upstream_sha"; then
            git merge --ff-only "$upstream_sha"
          else
            git merge --no-edit "$upstream_sha"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.merge.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        if: steps.merge.outputs.changed == 'true'
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
        if: steps.merge.outputs.changed == 'true'
      - name: Validate merged upstream source
        if: steps.merge.outputs.changed == 'true'
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Push updated main
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main
